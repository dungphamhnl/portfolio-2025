server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets: cache for a long time
  location ~* ^/(assets|chunks)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Static HTML pages in public/ (legal.html, privacy.html), then SPA fallback
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
